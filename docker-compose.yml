services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/fastapi
      TTL_SECONDS: 300
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1280

volumes:
  pgdata: